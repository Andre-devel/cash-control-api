# Local development overrides — not used in production
# Enables debug port and more verbose logging
services:
  postgres:
    ports:
      - "5432:5432"

  app:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      LOG_LEVEL_ROOT: INFO
      LOG_LEVEL_APP: DEBUG
    ports:
      - "${APP_PORT:-8080}:8080"
      - "5005:5005"
    entrypoint: >
      java
      -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      -jar app.jar
