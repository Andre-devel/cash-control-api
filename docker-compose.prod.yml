services:
  postgres:
    image: postgres:18-alpine
    container_name: cash-control-postgres
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d auth"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api:
    image: ghcr.io/${GITHUB_OWNER}/cash-control-api:latest
    container_name: cash-control-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/auth
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-15}
      MAX_FAILED_ATTEMPTS: ${MAX_FAILED_ATTEMPTS:-5}
      LOCKOUT_DURATION_MINUTES: ${LOCKOUT_DURATION_MINUTES:-15}
      PASSWORD_RESET_EXPIRY_MINUTES: ${PASSWORD_RESET_EXPIRY_MINUTES:-60}
      EMAIL_VERIFICATION_EXPIRY_HOURS: ${EMAIL_VERIFICATION_EXPIRY_HOURS:-24}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      APP_BASE_URL: https://${API_DOMAIN}
      OAUTH2_SUCCESS_REDIRECT_URL: https://${FRONTEND_DOMAIN}/auth/oauth2/callback
      OAUTH2_FAILURE_REDIRECT_URL: https://${FRONTEND_DOMAIN}/auth/oauth2/error
      ALLOWED_ORIGINS: https://${FRONTEND_DOMAIN}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-20}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - internal
    restart: unless-stopped

  web:
    image: ghcr.io/${GITHUB_OWNER}/cash-control-react:latest
    container_name: cash-control-web
    ports:
      - "127.0.0.1:3000:80"
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
