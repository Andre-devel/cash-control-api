spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.mail.autoconfigure.MailSenderAutoConfiguration
      - org.springframework.boot.mail.autoconfigure.MailSenderValidatorAutoConfiguration
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  health:
    mail:
      enabled: false

app:
  mail:
    from: noreply@dev.local
  jwt:
    # Local development runs over plain HTTP, where a Secure cookie is never sent back.
    refresh-cookie-secure: false

logging:
  level:
    com.cashcontrol.api: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG
    org.springframework.web: DEBUG