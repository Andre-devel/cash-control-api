spring:
  application:
    name: cash-control-api

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@example.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  oauth2-success-redirect-url: ${OAUTH2_SUCCESS_REDIRECT_URL:http://localhost:3000/auth/oauth2/callback}
  oauth2-failure-redirect-url: ${OAUTH2_FAILURE_REDIRECT_URL:http://localhost:3000/auth/oauth2/error}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  security:
    max-failed-attempts: ${MAX_FAILED_ATTEMPTS:5}
    lockout-duration-minutes: ${LOCKOUT_DURATION_MINUTES:15}
    password-reset-expiry-minutes: ${PASSWORD_RESET_EXPIRY_MINUTES:60}
    email-verification-expiry-hours: ${EMAIL_VERIFICATION_EXPIRY_HOURS:24}
    rate-limit-requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:20}
    rate-limit-window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  retention:
    password-reset-days: ${RETENTION_PASSWORD_RESET_DAYS:30}
    verification-token-days: ${RETENTION_VERIFICATION_TOKEN_DAYS:7}

  attachments:
    max-file-size-mb: ${ATTACHMENT_MAX_SIZE_MB:10}
    max-per-transaction: ${ATTACHMENT_MAX_PER_TRANSACTION:5}
    allowed-types: pdf,png,jpg,jpeg

  dashboard:
    upcoming-bills-days: ${UPCOMING_BILLS_DAYS:7}
    upcoming-bills-max-results: ${UPCOMING_BILLS_MAX_RESULTS:20}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true