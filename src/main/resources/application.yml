server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: cash-control-api

  threads:
    virtual:
      enabled: true

  # Sem isto vale o default do Boot (1 MB por arquivo), que rejeitaria uploads
  # antes de o serviço aplicar os próprios limites — os de anexo (10 MB) inclusive.
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:25MB}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile

  # No defaults: a missing SMTP credential must fail at startup rather than let the
  # application run unable to deliver verification and password-reset emails.
  # The dev profile excludes MailSenderAutoConfiguration and the test profile
  # overrides these values, so neither resolves these placeholders.
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM}
  oauth2-success-redirect-url: ${OAUTH2_SUCCESS_REDIRECT_URL:http://localhost:3000/auth/oauth2/callback}
  oauth2-failure-redirect-url: ${OAUTH2_FAILURE_REDIRECT_URL:http://localhost:3000/auth/oauth2/error}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
    refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:true}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:5174}
  security:
    max-failed-attempts: ${MAX_FAILED_ATTEMPTS:5}
    lockout-duration-minutes: ${LOCKOUT_DURATION_MINUTES:15}
    password-reset-expiry-minutes: ${PASSWORD_RESET_EXPIRY_MINUTES:60}
    email-verification-expiry-hours: ${EMAIL_VERIFICATION_EXPIRY_HOURS:24}
    rate-limit-requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:20}
    rate-limit-window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  retention:
    password-reset-days: ${RETENTION_PASSWORD_RESET_DAYS:30}
    verification-token-days: ${RETENTION_VERIFICATION_TOKEN_DAYS:7}
    refresh-token-days: ${RETENTION_REFRESH_TOKEN_DAYS:30}

  storage:
    # Em produção precisa apontar para um volume montado. O default cai em java.io.tmpdir,
    # que serve para o dev local mas some junto com o container a cada deploy.
    local-path: ${APP_STORAGE_LOCAL_PATH:${java.io.tmpdir}/cash-control-attachments}

  attachments:
    max-file-size-mb: ${ATTACHMENT_MAX_SIZE_MB:10}
    max-per-transaction: ${ATTACHMENT_MAX_PER_TRANSACTION:5}
    allowed-types: pdf,png,jpg,jpeg

  statement-import:
    max-file-size-mb: ${STATEMENT_IMPORT_MAX_SIZE_MB:5}
    max-rows: ${STATEMENT_IMPORT_MAX_ROWS:5000}

  invoice-import:
    max-file-size-mb: ${INVOICE_IMPORT_MAX_SIZE_MB:5}

  receipt-import:
    # Alinhado ao teto de anexo: o comprovante é gravado como anexo depois de lido, e
    # aceitar aqui um arquivo que o anexo recusaria adiante só adiaria o erro.
    max-file-size-mb: ${RECEIPT_IMPORT_MAX_SIZE_MB:10}

  ocr:
    # Print de comprovante é o caso principal (Nubank e PicPay compartilham imagem, não PDF).
    enabled: ${OCR_ENABLED:true}
    binary: ${OCR_BINARY:tesseract}
    language: ${OCR_LANGUAGE:por}
    timeout-seconds: ${OCR_TIMEOUT_SECONDS:20}
    # Teto de OCR simultâneo. É o processamento mais pesado da API e os endpoints de
    # importação não passam pelo RateLimitingFilter, que hoje cobre só os caminhos de auth.
    max-concurrent: ${OCR_MAX_CONCURRENT:2}

  dashboard:
    upcoming-bills-days: ${UPCOMING_BILLS_DAYS:7}
    upcoming-bills-max-results: ${UPCOMING_BILLS_MAX_RESULTS:20}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    # Disabled: this indicator opens an SMTP connection on every /actuator/health
    # call, which adds latency to each probe, triggers provider rate limiting, and
    # takes the whole application DOWN whenever the mail provider is unreachable.
    mail:
      enabled: false